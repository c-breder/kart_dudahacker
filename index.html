<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kart Duda Hacker</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;font-family:'Baloo 2',system-ui,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.hidden{display:none!important}
.out{color:#fff;text-shadow:0 3px 0 #1d2340,2px 0 0 #1d2340,-2px 0 0 #1d2340,0 -2px 0 #1d2340,2px 2px 0 #1d2340,-2px 2px 0 #1d2340}
#hud{position:fixed;inset:0;pointer-events:none}
#lapBox{position:absolute;top:10px;left:12px;line-height:1}
#lap{font-size:26px;font-weight:800}
#time{font-size:20px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
#itemBox{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:70px;height:70px;border-radius:16px;background:rgba(255,255,255,.35);border:4px solid #fff;box-shadow:0 3px 0 #1d2340;display:flex;align-items:center;justify-content:center;font-size:40px}
#posBox{position:absolute;top:4px;right:14px;font-size:64px;font-weight:800;line-height:1}
#posBox sup{font-size:28px}
#minimap{position:absolute;top:84px;right:10px;width:120px;height:120px;opacity:.9}
#toast{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:30px;font-weight:800;padding:0 16px;transition:opacity .25s;opacity:0}
#count{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:120px;font-weight:800;line-height:1}
#touch{position:absolute;left:0;right:0;bottom:0;padding:12px 12px 22px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#touch .grp{display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
#touch button{pointer-events:auto;touch-action:none;border:4px solid #fff;color:#fff;font-family:inherit;font-weight:800;border-radius:50%;background:rgba(29,35,64,.45);box-shadow:0 4px 0 rgba(0,0,0,.25)}
#touch button.on{background:rgba(255,255,255,.45)}
#bL,#bR{width:80px;height:80px;font-size:32px}
#touch .right{display:grid;grid-template-columns:auto auto;gap:10px;align-items:end;justify-items:center;pointer-events:auto}
#bUp{width:80px;height:80px;font-size:30px}
#bDown{width:64px;height:64px;font-size:24px}
#bItem{width:66px;height:66px;font-size:32px}
#bHonk{width:48px;height:48px;font-size:20px}
.rivals{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.chip{font-family:inherit;font-size:17px;font-weight:800;border-radius:999px;padding:4px 16px;border:3px solid #fff;background:rgba(255,255,255,.45);color:#000;opacity:.6;cursor:pointer}
.chip.on{background:#fff;color:#000;opacity:1}
.chip .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
#mute{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);pointer-events:auto;background:rgba(255,255,255,.4);border:3px solid #fff;border-radius:12px;font-size:20px;padding:2px 10px}
body.touch #mute{bottom:auto;top:88px;left:12px;transform:none}
#bChant{position:fixed;top:72px;left:12px;pointer-events:auto;font-family:inherit;font-weight:800;font-size:17px;color:#fff;background:#d6247a;border:3px solid #fff;border-radius:14px;padding:4px 14px;box-shadow:0 4px 0 #8c1350;touch-action:none}
#bChant:disabled{background:#8a7a85;box-shadow:0 4px 0 #555}
body.touch #bChant{top:132px}
#coins{position:absolute;top:62px;left:12px;font-size:20px;font-weight:800}
body:not(.touch) #coins{top:118px}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px;background:linear-gradient(180deg,rgba(255,120,170,.55),rgba(90,80,220,.55));overflow:auto}
.overlay>:first-child{margin-top:auto}.overlay>:last-child{margin-bottom:auto}
h1{margin:0;font-size:clamp(40px,9vw,72px);line-height:1}
.sub{margin:6px 0 14px;font-size:18px;font-weight:600;text-align:center}
#cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.card{width:150px;background:#fff;border-radius:20px;padding:10px 10px 12px;text-align:center;border:5px solid transparent;box-shadow:0 5px 0 rgba(29,35,64,.35);cursor:pointer;transition:transform .15s}
.card.sel{border-color:#ffcf1f;transform:translateY(-6px) scale(1.04)}
.card svg{width:124px;height:auto;display:block;margin:2px auto 8px}
.card input{width:100%;font-family:inherit;font-size:17px;font-weight:800;text-align:center;border:2px solid #ddd;border-radius:10px;padding:4px;color:#000;background:#fff;-webkit-text-fill-color:#000;color-scheme:light;user-select:text;-webkit-user-select:text}
.card .tag{font-size:12px;color:#667;font-weight:600;margin-top:4px}
.row{margin-top:16px;font-size:18px;font-weight:800}
select{font-family:inherit;font-size:17px;font-weight:800;border-radius:10px;border:3px solid #fff;padding:2px 8px}
.big{margin-top:16px;font-family:inherit;font-size:30px;font-weight:800;color:#1d2340;background:#ffcf1f;border:none;border-radius:18px;padding:6px 40px;box-shadow:0 6px 0 #c48b00;cursor:pointer}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #c48b00}
.big.alt{background:#fff;box-shadow:0 6px 0 #aab;font-size:22px}
.hint{font-size:15px;font-weight:600;text-align:center;margin-top:14px;max-width:520px}
#resList{background:rgba(255,255,255,.92);border-radius:20px;padding:10px 18px;min-width:280px;margin-top:10px}
.resRow{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;color:#1d2340;padding:4px 0}
.resRow .p{width:42px;font-size:26px}
.resRow .av{width:44px;height:44px;border-radius:50%;overflow:hidden;display:inline-block;flex:none}
.resRow .av svg{width:50px;height:auto;margin:0 0 0 -3px}
.resRow .t{margin-left:auto;font-weight:600;font-size:16px;color:#556}
.resRow.me{color:#d6247a}
#resMsg{font-size:24px;text-align:center;margin-top:6px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="lapBox" class="out"><div id="lap">VOLTA 1/3</div><div id="time">0:00.00</div></div>
  <div id="itemBox"><span id="itemIcon"></span></div>
  <div id="posBox" class="out"><span id="pos">3</span><sup>º</sup></div>
  <canvas id="minimap" width="240" height="240"></canvas>
  <div id="toast" class="out"></div>
  <div id="count" class="out"></div>
  <div id="touch" class="hidden">
    <div class="grp"><button id="bL">◀</button><button id="bR">▶</button></div>
    <div class="right"><button id="bHonk">📯</button><button id="bItem">🎁</button><button id="bDown">▼</button><button id="bUp">▲</button></div>
  </div>
  <button id="mute">🔊</button>
  <button id="bChant" class="hidden">💰 CHANTAGEM</button>
  <div id="coins" class="out hidden">🪙 x 0</div>
</div>

<div id="menu" class="overlay">
  <h1 class="out">Kart Duda Hacker 🏁</h1>
  <div class="sub out">Escolha sua piloto e contra quem você quer correr!</div>
  <div id="cards"></div>
  <div class="row out" style="text-align:center">Correr contra:<div class="rivals" id="rivals"></div></div>
  <div class="row out">Modo:
    <select id="diff"><option value="facil">Fácil</option><option value="medio" selected>Médio</option><option value="dificil">Difícil</option><option value="psicose">Psicose 😈</option></select>
    &nbsp; Voltas:
    <select id="laps"><option>1</option><option>2</option><option selected>3</option><option>5</option></select>
  </div>
  <div class="hint out hidden" id="psyNote">Modo psicose: você é a Duda contra a Trinity, no difícil 😈</div>
  <button id="go" class="big">CORRER!</button>
  <div class="hint out" id="hint"></div>
</div>

<div id="results" class="overlay hidden">
  <h1 class="out" id="resTitle">Fim!</h1>
  <div id="resMsg" class="out"></div>
  <div id="resList"></div>
  <div class="btns">
    <button id="again" class="big">DE NOVO!</button>
    <button id="toMenu" class="big alt">Trocar piloto</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrapAng=a=>Math.atan2(Math.sin(a),Math.cos(a));
const isTouch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
if(isTouch) document.body.classList.add('touch');

/* ---------- Personagens ---------- */
const CHARS=[
  {name:'Trinity', eye:'#6a3a20', hair:'#c4421c', shirt:'#1c1c22', kart:'#8a3ffc', tag:'cabelo ruivo · blusa preta'},
  {name:'Duda', eye:'#6a3a20',  hair:'#e0662b', shirt:'#1f3a8a', kart:'#f5b800', tag:'cabelo ruivo · blusa azul'},
  {name:'Lorera', eye:'#2e9a4e',  hair:'#191314', shirt:'#e0457b', kart:'#19b38a', tag:'cabelo preto'},
  {name:'Joelly', eye:'#3a2216', hair:'#3b2618', tip:'#b07a3e', shirt:'#f0765a', inner:'#f3dfb0', skin:'#c98d64', skinD:'#a8704c', curly:true, kart:'#ff5aa0', tag:'cacheada'}
];
try{const s=JSON.parse(localStorage.getItem('gp-amigas-nomes-v2')||'null'); if(Array.isArray(s)) s.forEach((n,i)=>{if(n&&CHARS[i])CHARS[i].name=n;});}catch(e){}
let chosen=0, rivals=[true,true,true,true];
try{chosen=+(localStorage.getItem('gp-amigas-escolha')||0)||0;const rv=JSON.parse(localStorage.getItem('gp-amigas-rivais')||'null');if(Array.isArray(rv))rivals=[0,1,2,3].map(i=>rv[i]!==false);}catch(e){}
if(!(chosen>=0&&chosen<CHARS.length))chosen=0;

function shade(hex,f){let n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  if(f<0){r*=1+f;g*=1+f;b*=1+f;}else{r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f;}
  return '#'+((1<<24)|(Math.round(r)<<16)|(Math.round(g)<<8)|Math.round(b)).toString(16).slice(1);}
const mir=half=>half.map(r=>r+[...r].reverse().join(''));
const GRID_FRONT=mir([".....hHH","...hHHLL","..hHHLLH","..HHHHHH",".hHHhHHh",".HHhSSSS",".HHsSSSS",".HHSEESS",".HHSIWSS",".HHSBSSS",".HhHSSSM",".HhHHsSS",".HhHHHsS",".HhHTTTT",".hHTTTtT",".hTTTTTT","..TTTTTT",".TTTTTTT"]);
const GRID_BACK=mir([".....hHH","...hHHLL","..hHHLLH","..HHHHHH",".hHHHHHH",".HHHHhHH",".HHHHHHh",".HHhHHHH",".HHHHHhH",".HHHHHHH",".hHHHhHH","TTTHHHHH","TTTHHHhH","TTTHHHHH","TTTThHHH","TTTTHHHH","TTTTTHHH"]);
function pal(c){const black=c.hair==='#191314',bshirt=c.shirt==='#1c1c22';
  return {H:black?'#2a2026':c.hair,h:black?'#120d11':shade(c.hair,-0.32),L:black?'#5b4f66':shade(c.hair,0.3),
    S:c.skin||'#f6cfae',s:c.skinD||'#e3a585',E:'#2a1610',I:c.eye,W:'#ffffff',B:c.skin?'#d9777a':'#f59aa6',M:'#a0453f',
    T:bshirt?'#1e1e24':c.shirt,t:bshirt?'#3e3e4a':shade(c.shirt,-0.28)};}
function pixelSVG(c,g){
  const C=pal(c),h=g.length,w=g[0].length,has=(x,y)=>g[y]&&g[y][x]&&g[y][x]!=='.';
  let out='';const cell=(x,y,col)=>`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${col}"/>`;
  for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){if(!has(x,y)&&[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>has(x+a,y+b)))out+=cell(x,y,'#1a0f0a');}
  g.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch==='.')return;let col=C[ch];
    if(ch==='W'){out+=cell(x,y,C.I)+`<rect x="${x+0.08}" y="${y+0.08}" width="0.45" height="0.45" fill="#fff"/>`;return;}if(ch==='H'&&(x+y)%2===0&&y>h*0.35)col=c.tip?(y>h*0.45?c.tip:C.h):C.h;if(ch==='T'&&(x+y)%2===0&&y>h*0.85)col=C.t;out+=cell(x,y,col);}));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 ${w+2} ${h+2}" width="${(w+2)*20}" height="${(h+2)*20}" shape-rendering="crispEdges">${out}</svg>`;}
const GRID_BIG=mir(["....OOOOO","..OOHHHHH",".OHHHHHHH",".OHHHHHHH","OHHHHHHHH",
 "OHHHHHHHO","OHHHHHOOS","OHHOOOSSS","OHHOSOOSS","OHHOSWISS","OHHOSIISS","OHHOBSSSS","OHHOSSSSM","OHHHOSSSS","OHHHHOOSS",
 "OHHHOTTNN","OHHOTTTCC","OHOTTTTTT","OOTTTTTTT"]);
const GRID_CURLY=mir(["...OO.OOO","..OHHOHHH",".OHHHHHHH","OHHHHHHHH","OHHHHHHHH",
 "OHHHHHHHO","OHHHHHOOS","OHHOOOSSS","OHHOSOOSS","OHHOSWISS","OHHOSIISS","OHHOBSSSS","OHHOSSSSM","OHHHOSSSS","OHHHHOOSS",
 "OHHHOTTNN","OHOTTTTCC","OTTTTTTCC","OTTTTTTCC"]);
function portraitSVG(c){
  const g=c.curly?GRID_CURLY:GRID_BIG,black=c.hair==='#191314',bs=c.shirt==='#1c1c22';
  const HT=black?['#5d5470','#3a3348','#231d2b']:[shade(c.hair,0.3),c.hair,shade(c.hair,-0.3)];
  const TT=bs?['#55556a','#2a2a33','#17171c']:[shade(c.shirt,0.4),c.shirt,shade(c.shirt,-0.3)];
  const C={O:'#111014',S:c.skin||'#fbdcc0',N:c.skinD||'#e8b494',B:c.skin?'#d9777a':'#f5a3ab',M:c.skin?'#b0505a':'#e0606b',W:'#ffffff',I:c.eye};
  const hash=(x,y)=>{let n=(x*374761393+y*668265263)^0x5bd1e995;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967296;};
  let o='';g.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch==='.')return;let col=C[ch];
    if(ch==='H'){const v=hash(x,y);col=v<0.22?HT[0]:v>0.72?HT[2]:HT[1];
      if(c.curly){const cv=hash(x*3+1,y*5+2);col=(y>8&&cv<0.25+y*0.025)?(cv<0.12?shade(c.tip,0.2):c.tip):((x+y)%2?c.hair:(cv>0.6?'#24160e':'#4a301c'));}}
    else if(ch==='T'){const v=hash(x+7,y);col=v<0.15?TT[0]:v>0.8?TT[2]:TT[1];if(c.curly&&hash(x,y+3)<0.25)col='#ffb48a';}else if(ch==='C')col=c.inner||TT[0];
    o+=`<rect x="${x}" y="${y}" width="1.03" height="1.03" fill="${col}"/>`;}));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 20 ${g.length+1}" width="${20*16}" height="${(g.length+1)*16}" shape-rendering="crispEdges">${o}</svg>`;}
function backSVG(c){return pixelSVG(c,GRID_BACK);}

function buildCards(){
  const box=$('#cards'); box.innerHTML='';
  CHARS.forEach((c,i)=>{
    const d=document.createElement('div'); d.className='card'+(i===chosen?' sel':'');
    d.innerHTML=portraitSVG(c)+`<input maxlength="16" value="${c.name.replace(/"/g,'&quot;')}">`;
    d.addEventListener('click',e=>{ if(e.target.tagName==='INPUT') return; chosen=i; buildCards(); });
    const inp=d.querySelector('input');
    inp.addEventListener('input',()=>{c.name=inp.value.trim()||('Piloto '+(i+1)); saveNames(); buildRivals();});
    inp.addEventListener('focus',()=>{if(chosen!==i){chosen=i; document.querySelectorAll('.card').forEach((el,k)=>el.classList.toggle('sel',k===i)); buildRivals();}});
    box.appendChild(d);
  });
  buildRivals();
}
function buildRivals(){
  const box=$('#rivals'); box.innerHTML='';
  const others=CHARS.map((_,i)=>i).filter(i=>i!==chosen);
  if(!others.some(i=>rivals[i])) others.forEach(i=>rivals[i]=true);
  others.forEach(i=>{const b=document.createElement('button');b.className='chip'+(rivals[i]?' on':'');
    b.innerHTML=`<span class="dot" style="background:${CHARS[i].kart}"></span>`+CHARS[i].name.replace(/</g,'&lt;');
    b.addEventListener('click',()=>{rivals[i]=!rivals[i]; if(!others.some(k=>rivals[k])) rivals[i]=true; saveNames(); buildRivals();});
    box.appendChild(b);});
}
function saveNames(){try{localStorage.setItem('gp-amigas-modo',$('#diff').value);localStorage.setItem('gp-amigas-nomes-v2',JSON.stringify(CHARS.map(c=>c.name)));localStorage.setItem('gp-amigas-escolha',chosen);localStorage.setItem('gp-amigas-rivais',JSON.stringify(rivals));}catch(e){}}
buildCards();
$('#hint').textContent=isTouch
  ? '▲ acelera · ▼ freia/ré · ◀ ▶ vira · 🎁 lança o item pra frente · 📯 buzina'
  : 'Setas ou WASD pra dirigir · ESPAÇO lança o item pra frente (segurando ↓ a banana vai pra trás) · H buzina';

/* ---------- Áudio ---------- */
let AC=null, engOsc=null, engGain=null, muted=false;
function initAudio(){
  if(AC) {AC.resume&&AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    engOsc=AC.createOscillator(); engOsc.type='sawtooth';
    const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380;
    engGain=AC.createGain(); engGain.gain.value=0;
    engOsc.connect(f); f.connect(engGain); engGain.connect(AC.destination); engOsc.start();
  }catch(e){AC=null;}
}
function tone(freq,dur,type,vol,slide,delay){
  if(!AC||muted) return;
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(vol||0.07,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.05);
}
const SFX={
  beep:()=>tone(520,0.25,'square',0.08),
  go:()=>tone(1040,0.6,'square',0.08),
  item:()=>{[660,880,1320].forEach((f,i)=>tone(f,0.12,'triangle',0.08,null,i*0.07));},
  roll:()=>tone(900+Math.random()*400,0.04,'square',0.025),
  hit:()=>tone(700,0.5,'sawtooth',0.08,90),
  boost:()=>tone(200,0.5,'sawtooth',0.07,900),
  throw:()=>tone(1400,0.25,'triangle',0.06,300),
  drop:()=>tone(300,0.15,'triangle',0.08,150),
  bump:()=>tone(110,0.12,'square',0.06),
  honk:()=>{tone(392,0.18,'square',0.07);tone(494,0.18,'square',0.05);tone(392,0.2,'square',0.07,null,0.22);tone(494,0.2,'square',0.05,null,0.22);},
  lap:()=>{[523,659,784].forEach((f,i)=>tone(f,0.15,'square',0.06,null,i*0.1));},
  win:()=>{[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,0.18,'square',0.06,null,i*0.13));},
  lose:()=>{[392,370,349,330].forEach((f,i)=>tone(f,0.3,'triangle',0.07,null,i*0.25));}
};
$('#mute').addEventListener('click',()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';if(engGain)engGain.gain.value=0;});

/* ---------- Three.js base ---------- */
const renderer=new THREE.WebGLRenderer({canvas:$('#game'),antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fd3ff);
scene.fog=new THREE.Fog(0x8fd3ff,140,460);
const camera=new THREE.PerspectiveCamera(70,1,0.1,1500);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();
scene.add(new THREE.HemisphereLight(0xffffff,0x4f8a35,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.7); sun.position.set(60,120,40); scene.add(sun);

function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);return t;}
const LM=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));

/* ---------- Pista ---------- */
const RAW=[[0,40],[0,-60],[4,-110],[24,-140],[60,-150],[92,-132],[102,-98],[90,-66],[92,-34],[108,-6],[112,36],[96,72],[60,88],[22,80],[4,60]];
const SC=1.6, W=17, N=800;
const curve=new THREE.CatmullRomCurve3(RAW.map(p=>new THREE.Vector3(p[0]*SC,0,p[1]*SC)),true,'centripetal');
const P=[],T=[],NR=[];
for(let i=0;i<N;i++){
  const u=i/N, p=curve.getPointAt(u), t=curve.getTangentAt(u).normalize();
  P.push(p); T.push(t); NR.push(new THREE.Vector3(t.z,0,-t.x));
}
const L=curve.getLength(), SEG=L/N;
let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
P.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minZ=Math.min(minZ,p.z);maxZ=Math.max(maxZ,p.z);});
const CX=(minX+maxX)/2, CZ=(minZ+maxZ)/2;

function nearestIdx(x,z,guess){
  let best=guess,bd=1e18;
  for(let k=-40;k<=60;k++){const i=((guess+k)%N+N)%N;const dx=P[i].x-x,dz=P[i].z-z,d=dx*dx+dz*dz;if(d<bd){bd=d;best=i;}}
  return best;
}
function nearestGlobal(x,z){let best=0,bd=1e18;for(let i=0;i<N;i+=2){const dx=P[i].x-x,dz=P[i].z-z,d=dx*dx+dz*dz;if(d<bd){bd=d;best=i;}}return {i:best,d:Math.sqrt(bd)};}

function ribbon(inner,outer,y,vScale,mat){
  const pos=[],uv=[],nor=[],ind=[];
  for(let i=0;i<=N;i++){const k=i%N,p=P[k],n=NR[k];
    pos.push(p.x+n.x*inner,y,p.z+n.z*inner, p.x+n.x*outer,y,p.z+n.z*outer);
    uv.push(0,i*SEG/vScale,1,i*SEG/vScale); nor.push(0,1,0,0,1,0);}
  for(let i=0;i<N;i++){const a=i*2,b=a+1,c=a+2,d=a+3;ind.push(a,c,b,b,c,d);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setIndex(ind); const m=new THREE.Mesh(g,mat); scene.add(m); return m;
}

const bananaG=new THREE.TorusGeometry(0.55,0.2,8,14,Math.PI), bananaM=LM(0xffd93b);
function makeBanana(){const g=new THREE.Group();const b=new THREE.Mesh(bananaG,bananaM);b.rotation.z=Math.PI;b.position.y=0.75;g.add(b);
  const tip=new THREE.Mesh(new THREE.SphereGeometry(0.12,6,5),LM(0x5a3a1a));tip.position.set(0.55,0.75,0);g.add(tip);scene.add(g);return g;}
function makeShark(){const g=new THREE.Group(),grey=LM(0x6f8fb3),belly=LM(0xf2f5f8),dk=LM(0x111111);
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.5,14,10),grey);body.scale.set(0.75,0.7,1.6);g.add(body);
  const bel=new THREE.Mesh(new THREE.SphereGeometry(0.46,12,8),belly);bel.scale.set(0.68,0.45,1.45);bel.position.set(0,-0.14,0.05);g.add(bel);
  const fin=new THREE.Mesh(new THREE.ConeGeometry(0.2,0.55,4),grey);fin.position.set(0,0.48,-0.05);fin.rotation.x=-0.35;fin.scale.set(0.5,1,1.4);g.add(fin);
  const tail=new THREE.Mesh(new THREE.ConeGeometry(0.28,0.55,4),grey);tail.position.set(0,0.05,-0.95);tail.rotation.x=-Math.PI/2;tail.scale.set(0.25,1,1.6);g.add(tail);
  [-1,1].forEach(s=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.07,6,5),dk);e.position.set(s*0.27,0.1,0.55);g.add(e);
    const pf=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.05,0.22),grey);pf.position.set(s*0.4,-0.12,0.1);pf.rotation.z=s*-0.4;g.add(pf);});
  const mouth=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.04,0.05),dk);mouth.position.set(0,-0.08,0.76);g.add(mouth);
  g.scale.set(1.4,1.4,1.4);g.position.y=0.9;scene.add(g);return g;}
function useItem(r){
  if(!r||!r.item||r.rolling>0||state==='menu'||state==='count'||r.finished&&r.isP&&state!=='race') return;
  const it=r.item; r.item=null; if(r.isP) $('#itemIcon').textContent='';
  const fx=Math.sin(r.a),fz=Math.cos(r.a);
  if(it==='turbo'){r.boost=1.6; if(r.isP){SFX.boost();toast('PIMENTA TURBO! 🌶️🔥');}}
  else if(it==='banana'){const m=makeBanana();
    const back=!r.isP||keys.ArrowDown||keys.KeyS||touchS.brake;
    if(back){const x=r.x-fx*2.8,z=r.z-fz*2.8;m.position.set(x,0,z);items.push({type:'banana',mesh:m,x,z,owner:r,immune:0.6,ttl:60});if(r.isP)SFX.drop();}
    else{const lat=(r.x-P[r.idx].x)*NR[r.idx].x+(r.z-P[r.idx].z)*NR[r.idx].z;
      const ti=(r.idx+Math.round((22+Math.max(r.speed,0)*1.1)/SEG))%N;
      const ex=P[ti].x+NR[ti].x*lat, ez=P[ti].z+NR[ti].z*lat;
      m.position.set(r.x,1,r.z);
      items.push({type:'banana',mesh:m,x:ex,z:ez,sx:r.x,sz:r.z,fly:0.7,flyT:0.7,owner:r,immune:0,ttl:60});
      SFX.throw(); toast('🍌 Banana lançada!');}}
  else if(it==='tubarao'){const m=makeShark();const x=r.x+fx*3,z=r.z+fz*3;
    const target=racers.find(o=>o.rank===r.rank-1&&!o.finished)||null;
    items.push({type:'tubarao',mesh:m,x,z,a:r.a,spd:Math.max(r.speed+26,56),owner:r,immune:0.5,ttl:4.5,target,idx:r.idx});
    if(r.isP){SFX.throw();toast(target?`🦈 Tubarãozinho atrás da ${target.ch.name}!`:'🦈 Tubarãozinho solto!');}
    else if(target&&target.isP) toast(`🦈 ${r.ch.name} soltou um tubarãozinho em você!`);}
}
function hit(r,kind,by){
  if(r.spin>0) return;
  r.spin=SPIN; r.speed*=0.25; r.boost=0;
  if(r.isP){SFX.hit(); toast(kind==='tubarao'?(by&&!by.isP?`O tubarãozinho da ${by.ch.name} te mordeu! 🦈😵`:'MORDIDA! 🦈😵'):(by&&by.isP?'Escorregou na própria banana 🍌🤡':'Escorregou! 🍌😵'));}
  else if(by&&by.isP){SFX.hit(); toast(kind==='tubarao'?`Nhac! ${r.ch.name} foi mordida! 🦈😂`:`${r.ch.name} escorregou na sua banana! 🍌😂`);}
}

/* ---------- Física ---------- */
function physics(r,dt,c){
  let {throttle,brake,steer}=c;
  if(r.spin>0){r.spin-=dt;throttle=false;steer=0;r.speed*=Math.pow(0.2,dt);r.m.body.rotation.y=(1-Math.max(r.spin,0)/SPIN)*Math.PI*4;if(r.spin<=0)r.m.body.rotation.y=0;}
  const idx=nearestIdx(r.x,r.z,r.idx);
  const lat=(r.x-P[idx].x)*NR[idx].x+(r.z-P[idx].z)*NR[idx].z;
  const off=Math.abs(lat)>W/2+1.4;
  let maxS=MAXS*r.maxMul; if(r.panic>0)maxS*=0.85;
  if(r.boost>0){r.boost-=dt;maxS=52;r.speed=Math.max(r.speed,44);}
  else if(off) maxS*=0.45;
  if(throttle) r.speed+=ACC*dt;
  else if(brake) r.speed-=ACC*1.8*dt;
  else r.speed*=Math.pow(0.55,dt);
  if(r.speed>maxS) r.speed-=(r.speed-maxS)*Math.min(1,3.5*dt);
  r.speed=Math.max(r.speed,-9);
  r.steer+=(steer-r.steer)*Math.min(1,10*dt);
  const rate=2.25-0.55*clamp(Math.abs(r.speed)/MAXS,0,1);
  r.a-=r.steer*rate*dt*clamp(Math.abs(r.speed)/7,0,1)*(r.speed<0?-1:1);
  r.x+=Math.sin(r.a)*r.speed*dt; r.z+=Math.cos(r.a)*r.speed*dt;
  if(Math.abs(lat)>W/2+28){const s=Math.sign(lat);r.x-=NR[idx].x*s*(Math.abs(lat)-(W/2+28));r.z-=NR[idx].z*s*(Math.abs(lat)-(W/2+28));r.speed*=0.9;}
  // progresso
  let d=idx-r.idx; if(d<-N/2)d+=N; if(d>N/2)d-=N; r.total+=d; r.idx=idx;
  const newLap=clamp(Math.floor(r.total/N)+1,1,LAPS);
  if(r.isP&&newLap>r.lap&&!r.finished){ if(newLap===LAPS){toast('VOLTA FINAL! 🔥');} else toast(`Volta ${newLap}/${LAPS}`); SFX.lap(); }
  r.lap=Math.max(r.lap,newLap);
  if(!r.finished&&r.total>=LAPS*N){r.finished=true;r.finishTime=raceTime; if(r.isP) playerFinished();}
  // visual
  const m=r.m; m.g.position.set(r.x,0,r.z); m.g.rotation.y=r.a;
  m.body.position.y=(off?Math.sin(raceTime*40)*0.06:Math.sin(raceTime*25)*0.02)*clamp(Math.abs(r.speed)/10,0,1);
  m.body.rotation.z=r.steer*0.07*clamp(r.speed/MAXS,0,1);
  m.wheels.forEach(w=>w.rotation.x+=r.speed*dt/0.43);
  {const vx=r.x-camera.position.x,vz=r.z-camera.position.z;const away=Math.sin(r.a)*vx+Math.cos(r.a)*vz>0;m.back.visible=away;m.front.visible=!away;
   const rot=-r.steer*0.12*(away?1:-1);m.back.material.rotation=rot;m.front.material.rotation=rot;}
  if(r.panic>0){m.body.rotation.z+=Math.sin(raceTime*35)*0.18;m.body.position.y+=Math.abs(Math.sin(raceTime*18))*0.15;}
  m.flame.visible=r.boost>0; if(r.boost>0){const s=0.8+Math.random()*0.5;m.flame.scale.set(s,s,s);}
}
function aiControl(r,dt){
  const ai=r.ai; ai.laneT-=dt;
  if(ai.laneT<=0){ai.lane=(Math.random()*2-1)*W*0.3;ai.laneT=1.5+Math.random()*3;}
  // desvia de bananas próximas
  let lane=ai.lane;
  for(const it of items){if(it.type!=='banana')continue;let d=nearestIdx(it.x,it.z,r.idx)-r.idx;if(d<0)d+=N;if(d>4&&d<30&&Math.random()<r.ai.D.dodge){const bl=(it.x-P[r.idx].x)*NR[r.idx].x+(it.z-P[r.idx].z)*NR[r.idx].z;if(Math.abs(bl-lane)<2.5)lane=bl>0?bl-4:bl+4;}}
  const look=(r.idx+12+Math.floor(Math.abs(r.speed)*0.35))%N;
  const tx=P[look].x+NR[look].x*lane, tz=P[look].z+NR[look].z*lane;
  const d=wrapAng(Math.atan2(tx-r.x,tz-r.z)-r.a);
  if(r.item&&r.rolling<=0){ai.itemDelay-=dt;if(ai.itemDelay<=0)useItem(r);}
  return {throttle:Math.abs(d)<1.3,brake:false,steer:clamp(-d*2.6,-1,1)};
}
function playerControl(){
  const L=keys.ArrowLeft||keys.KeyA||touchS.left, R=keys.ArrowRight||keys.KeyD||touchS.right;
  const brake=keys.ArrowDown||keys.KeyS||touchS.brake;
  const gas=keys.ArrowUp||keys.KeyW||touchS.gas;
  return {throttle:!!gas,brake:!!brake,steer:(R?1:0)-(L?1:0)};
}

/* ---------- Câmera ---------- */
const camT=new THREE.Vector3(), look=new THREE.Vector3();
function placeCam(snap,dt){
  const p=player, fx=Math.sin(p.a), fz=Math.cos(p.a);
  camT.set(p.x-fx*7.8,3.5,p.z-fz*7.8);
  if(snap) camera.position.copy(camT); else camera.position.lerp(camT,1-Math.pow(0.0008,dt));
  look.set(p.x+fx*6,1.3,p.z+fz*6); camera.lookAt(look);
  const fov=70+(p.boost>0?9:0); camera.fov+=(fov-camera.fov)*0.1; camera.updateProjectionMatrix();
}

/* ---------- HUD ---------- */
const mm=$('#minimap'), mctx=mm.getContext('2d');
const mmScale=Math.min(200/(maxX-minX),200/(maxZ-minZ));
const mmX=x=>120+(x-CX)*mmScale, mmY=z=>120+(z-CZ)*mmScale;
const mmBase=document.createElement('canvas'); mmBase.width=mmBase.height=240;
(function(){const g=mmBase.getContext('2d');g.lineCap=g.lineJoin='round';
  [['#1d2340',18],['#ffffff',11]].forEach(([c,w])=>{g.strokeStyle=c;g.lineWidth=w;g.beginPath();P.forEach((p,i)=>i?g.lineTo(mmX(p.x),mmY(p.z)):g.moveTo(mmX(p.x),mmY(p.z)));g.closePath();g.stroke();});})();
function fmt(t){const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(2);}
function updateHUD(){
  if(!player) return;
  $('#lap').textContent=`VOLTA ${player.lap}/${LAPS}`;
  $('#time').textContent=fmt(raceTime);
  $('#pos').textContent=player.rank;
  $('#posBox').style.color=['#ffd23f','#d9e2ff','#ff9b5e','#ffffff'][player.rank-1]||'#fff';
  mctx.clearRect(0,0,240,240); mctx.drawImage(mmBase,0,0);
  racers.slice().sort((a,b)=>a.isP-b.isP).forEach(r=>{mctx.fillStyle=r.ch.kart;mctx.strokeStyle='#fff';mctx.lineWidth=4;mctx.beginPath();mctx.arc(mmX(r.x),mmY(r.z),r.isP?11:8,0,7);mctx.fill();mctx.stroke();});
}

/* ---------- Fim ---------- */
function playerFinished(){
  state='done'; doneT=2.2;
  toast(player.rank===1?'VITÓRIA! 👑':'CHEGOU! 🏁');
  (player.rank===1?SFX.win:SFX.lose)();
}
function showResults(){
  const list=racers.slice().sort((a,b)=>a.rank-b.rank);
  const n=racers.length;
  const msgs={};for(let k=1;k<=n;k++)msgs[k]=k===1?'RAINHA DA PISTA 👑':k===n?'Pelo menos o cabelo tava impecável 💅':'Quase! Com certeza foi culpa do tubarãozinho 🦈';
  $('#resTitle').textContent=player.rank===1?'1º LUGAR!':player.rank+'º lugar';
  $('#resMsg').textContent=(msgs[player.rank]||'')+(coins?` · 🪙 x ${coins} moedas da Duda`:'');
  $('#resList').innerHTML=list.map(r=>`<div class="resRow ${r.isP?'me':''}"><span class="p">${['🥇','🥈','🥉','4º'][r.rank-1]}</span><span class="av" style="background:${r.ch.kart}">${portraitSVG(r.ch)}</span>${r.ch.name.replace(/</g,'&lt;')}${r.isP?' (você)':''}<span class="t">${r.finished?fmt(r.finishTime):'ainda correndo…'}</span></div>`).join('');
  $('#results').classList.remove('hidden'); $('#touch').classList.add('hidden'); $('#bChant').classList.add('hidden'); $('#itemIcon').textContent='';
}

/* ---------- Loop ---------- */
let last=performance.now(), menuAng=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  boxes.forEach(b=>{b.mesh.rotation.x+=dt*0.9;b.mesh.rotation.y+=dt*1.3;b.mesh.position.y=1.3+Math.sin(now/400+b.phase)*0.2;
    b.mesh.material.color.setHSL(((now/3000)+b.phase)%1,0.8,0.65);
    if(!b.active){b.respawn-=dt;if(b.respawn<=0){b.active=true;b.mesh.visible=true;}}});
  if(toastT>0){toastT-=dt;if(toastT<=0)$('#toast').style.opacity=0;}
  if(honkCD>0) honkCD-=dt;

  if(state==='menu'){
    menuAng+=dt*0.08;
    camera.position.set(CX+Math.cos(menuAng)*190,85,CZ+Math.sin(menuAng)*190); camera.lookAt(CX,0,CZ);
    camera.fov=60; camera.updateProjectionMatrix();
    if(engGain) engGain.gain.value=0;
  } else {
    if(state==='count'){
      countT-=dt; const n=Math.ceil(countT);
      if(n!==lastCount){lastCount=n; if(n>0){$('#count').textContent=n;SFX.beep();} }
      if(countT<=0){state='race';$('#count').textContent='VAI!';SFX.go();setTimeout(()=>{$('#count').textContent='';},800);}
      racers.forEach(r=>physics(r,0,{throttle:false,brake:false,steer:0}));
    } else {
      raceTime+=dt;
      // elástico pra corrida ficar disputada
      racers.forEach(r=>{if(r.isP){r.maxMul=1;return;}const diff=r.total-player.total;
        r.maxMul=r.ai.skill*(diff>60?r.ai.D.ahead:diff<-60?r.ai.D.behind:1)*(r.finished?0.8:1);});
      racers.forEach(r=>{const c=(r.isP&&state==='race')?playerControl():aiControl(r,dt);physics(r,dt,c);});
      // chantagem
      if(chantCD>0)chantCD-=dt;
      if(chantVictim){const b=$('#bChant');b.disabled=chantCD>0;b.textContent=chantCD>0?`💰 CHANTAGEM (${Math.ceil(chantCD)})`:'💰 CHANTAGEM';
        const v=chantVictim; if(v.panic>0){v.panic-=dt;v.coinT-=dt;if(v.coinT<=0){spawnCoin(v);v.coinT=0.09;} if(v.panic<=0&&v.panicSprite)v.panicSprite.visible=false;}
        if(chantAI&&state==='race'){aiChantT-=dt;if(aiChantT<=0){chantagem(chantAI);aiChantT=18+Math.random()*12;}}}
      // batidas entre karts
      if(bumpCD>0)bumpCD-=dt;
      for(let i=0;i<racers.length;i++)for(let j=i+1;j<racers.length;j++){const a=racers[i],b=racers[j];
        const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
        if(d<2.4&&d>0.001){const push=(2.4-d)/2,nx=dx/d,nz=dz/d;a.x-=nx*push;a.z-=nz*push;b.x+=nx*push;b.z+=nz*push;a.speed*=0.98;b.speed*=0.98;
          if((a.isP||b.isP)&&bumpCD<=0){SFX.bump();bumpCD=0.4;}}}
      // caixas
      racers.forEach(r=>{boxes.forEach(b=>{if(!b.active)return;const dx=b.mesh.position.x-r.x,dz=b.mesh.position.z-r.z;
        if(dx*dx+dz*dz<5.3){b.active=false;b.mesh.visible=false;b.respawn=3;
          if(!r.item&&r.rolling<=0){r.pending=pickItem(r);r.rolling=r.isP?1.0:0.3;r.ai.itemDelay=r.ai.D?r.ai.D.itemMin+Math.random()*r.ai.D.itemRand:2;}}});
        if(r.rolling>0){r.rolling-=dt;
          if(r.isP){if(Math.random()<0.5){$('#itemIcon').textContent=Object.values(ICON)[Math.random()*3|0];SFX.roll();}}
          if(r.rolling<=0){r.item=r.pending;r.pending=null;if(r.isP){$('#itemIcon').textContent=ICON[r.item];SFX.item();}}}});
      // itens no chão / voando
      for(let k=items.length-1;k>=0;k--){const it=items[k]; it.ttl-=dt; it.immune-=dt; let dead=it.ttl<=0;
        if(it.type==='coin'){
          if(it.y>0.6||it.vy>0){it.vy-=22*dt;it.x+=it.vx*dt;it.z+=it.vz*dt;it.y+=it.vy*dt;if(it.y<=0.6){it.y=0.6;it.vy=0;it.vx=0;it.vz=0;}}
          it.mesh.position.set(it.x,it.y+(it.vy===0?Math.sin(now/300+k)*0.12:0),it.z); it.mesh.rotation.z+=dt*5;
          if(!dead&&it.y<1.5) for(const r of racers){ if(r===it.owner) continue; const dx=r.x-it.x,dz=r.z-it.z;
            if(dx*dx+dz*dz<4.5){dead=true;r.boost=Math.max(r.boost,0.3);if(r.isP){coins++;$('#coins').textContent='🪙 x '+coins;$('#coins').classList.remove('hidden');tone(1320,0.08,'square',0.05);tone(1760,0.12,'square',0.05,null,0.07);}break;}}
          if(dead){scene.remove(it.mesh);items.splice(k,1);} continue;}
        if(it.type==='tubarao'&&!dead){
          let tx,tz; if(it.target&&!it.target.finished){tx=it.target.x;tz=it.target.z;}else{it.idx=nearestIdx(it.x,it.z,it.idx);const la=(it.idx+10)%N;tx=P[la].x;tz=P[la].z;}
          const d=wrapAng(Math.atan2(tx-it.x,tz-it.z)-it.a); it.a+=clamp(d,-4*dt,4*dt);
          it.x+=Math.sin(it.a)*it.spd*dt; it.z+=Math.cos(it.a)*it.spd*dt;
          it.mesh.position.set(it.x,0.9+Math.abs(Math.sin(it.ttl*9))*0.5,it.z); it.mesh.rotation.y=it.a; it.mesh.rotation.z=Math.sin(it.ttl*20)*0.25;
        } else if(it.type==='banana'){it.mesh.rotation.y+=dt*(it.fly>0?12:0.5);
          if(it.fly>0){it.fly-=dt;const u=1-Math.max(it.fly,0)/it.flyT;it.mesh.position.set(it.sx+(it.x-it.sx)*u,Math.sin(u*Math.PI)*6,it.sz+(it.z-it.sz)*u);if(it.fly<=0){it.mesh.position.set(it.x,0,it.z);SFX.drop();}continue;}}
        if(!dead) for(const r of racers){ if(r===it.owner&&it.immune>0) continue;
          const dx=r.x-it.x,dz=r.z-it.z; if(dx*dx+dz*dz<(it.type==='tubarao'?4:2.6)){hit(r,it.type,it.owner);dead=true;break;}}
        if(dead){scene.remove(it.mesh);items.splice(k,1);}
      }
      if(items.filter(i=>i.type!=='coin').length>24){const old=items.findIndex(i=>i.type==='banana');if(old>=0){scene.remove(items[old].mesh);items.splice(old,1);}}
    }
    // ranking
    racers.slice().sort((a,b)=>(b.finished-a.finished)||(a.finished?a.finishTime-b.finishTime:b.total-a.total)).forEach((r,i)=>{if(!(r.finished&&r.rankLocked))r.rank=i+1;if(r.finished)r.rankLocked=true;});
    if(state!=='done'||doneT>0) updateHUD();
    if(state==='done'){doneT-=dt;if(doneT<=0&&$('#results').classList.contains('hidden'))showResults();}
    placeCam(false,dt);
    if(engGain&&engOsc&&!muted){engGain.gain.value=state==='done'?0.012:0.03;engOsc.frequency.value=55+Math.abs(player.speed)*4.2+(player.boost>0?40:0);}
  }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
